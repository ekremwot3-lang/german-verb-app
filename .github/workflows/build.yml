name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git python3-pip libffi-dev libssl-dev \
          zip unzip tar autoconf libtool pkg-config \
          zlib1g-dev libncurses6 libncursesw6 cmake libstdc++6

    - name: Install Python Libraries (Fixed Pip & Cython)
      run: |
        python -m pip install "pip==23.3.1" "setuptools<69.0.0"
        pip install "cython<3.0.0" buildozer flet

    - name: Build APK with System Android SDK
      env:
        ANDROID_HOME: ${{ runner.workspace }}/../android-sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
